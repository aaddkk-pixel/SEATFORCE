<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#111111" />
  <title>SEATFORCE</title>
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="icon" type="image/png" href="icon.png" />
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #111; color: #f4f4f5; margin: 0; padding: 16px; }
    .card { background: #1e1e24; border-radius: 14px; padding: 16px; margin-bottom: 14px; }
    .row { display: flex; gap: 8px; }
    input, button { font-size: 16px; padding: 14px; border-radius: 10px; border: none; }
    input { flex: 1; background: #2b2b34; color: #fff; text-transform: uppercase; min-width: 0; }
    button { background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; }
    button:active { opacity: 0.85; }
    button.secondary { background: #3f3f46; }
    button:disabled { background: #27272a; color: #71717a; cursor: not-allowed; }
    .big-force { font-size: 76px; font-weight: 800; text-align: center; line-height: 1.05; margin: 10px 0; color: #38bdf8; font-variant-numeric: tabular-nums; }
    .sub-label { text-align: center; color: #a1a1aa; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 16px; font-variant-numeric: tabular-nums; }
    th, td { text-align: left; padding: 10px 6px; border-bottom: 1px solid #2b2b34; }
    th { color: #a1a1aa; font-size: 12px; text-transform: uppercase; }
    .banner { background: #3b2f10; border: 1px solid #854d0e; color: #fef08a; padding: 12px; border-radius: 10px; font-size: 14px; margin-bottom: 14px; display: none; line-height: 1.4; }
  </style>
</head>
<body>

  <div id="iosWarning" class="banner">
    <strong>iPhone / iPad Users:</strong> Apple Safari does not support Bluetooth web apps. Please open this exact link inside the free <strong>Bluefy</strong> browser app from the App Store.
  </div>

  <div class="card">
    <div class="row" style="margin-bottom: 10px;">
      <button id="connectBtn" style="width: 100%;">1. Connect to SEATFORCE</button>
    </div>
    <div class="row">
      <input id="cartridgeInput" type="text" maxlength="16" placeholder="Case / Cartridge Name" />
      <button id="sendBtn" disabled>2. Set &amp; Sync</button>
    </div>
    <div id="status" style="margin-top: 10px; font-size: 13px; color: #a1a1aa; text-align: center;">Disconnected</div>
  </div>

  <div class="card">
    <div id="readingType" class="sub-label">Status</div>
    <div id="bigDisplay" class="big-force">Ready...</div>
    <div id="statsLine" class="sub-label">Count: 0 &bull; SD: 0.00</div>
  </div>

  <div class="card">
    <div class="header-row">
      <div class="sub-label" style="text-align: left;">Readings (Newest Top)</div>
      <button id="csvBtn" class="secondary" style="padding: 8px 12px; font-size: 13px;" disabled>Export CSV</button>
    </div>
    <table>
      <thead>
        <tr><th>#</th><th>Force</th><th>SD</th><th>Time</th></tr>
      </thead>
      <tbody id="historyBody"></tbody>
    </table>
  </div>

<script>
  const NUS_SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
  const NUS_RX      = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
  const NUS_TX      = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

  let rxChar = null;
  let holdTimeout = null;
  let wakeLock = null;
  let isConnected = false;
  let currentSession = 'SESSION';
  let sessionRows = [];

  const encoder = new TextEncoder();
  const decoder = new TextDecoder();

  const connectBtn = document.getElementById('connectBtn');
  const sendBtn = document.getElementById('sendBtn');
  const csvBtn = document.getElementById('csvBtn');
  const cartridgeInput = document.getElementById('cartridgeInput');
  const statusEl = document.getElementById('status');
  const bigDisplay = document.getElementById('bigDisplay');
  const readingType = document.getElementById('readingType');
  const statsLine = document.getElementById('statsLine');
  const historyBody = document.getElementById('historyBody');

  async function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
    } catch (err) {
      // Ignore if battery saver or browser blocks wake lock
    }
  }

  function releaseWakeLock() {
    if (wakeLock !== null) {
      wakeLock.release().catch(() => {});
      wakeLock = null;
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && isConnected) {
      requestWakeLock();
    }
  });

  function resetToReady() {
    clearTimeout(holdTimeout);
    holdTimeout = null;
    readingType.textContent = 'Status';
    bigDisplay.style.color = '#38bdf8';
    bigDisplay.textContent = 'Ready...';
  }

  if (!navigator.bluetooth) {
    document.getElementById('iosWarning').style.display = 'block';
    connectBtn.disabled = true;
    statusEl.textContent = 'Bluetooth unavailable in this browser';
  }

  async function writeLine(text) {
    if (!rxChar) return;
    await rxChar.writeValueWithoutResponse(encoder.encode(text + '\n'));
  }

  function getFormattedTime() {
    const d = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    const date = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
    const time = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    return `TIME,${date} ${time}`;
  }

  connectBtn.addEventListener('click', async () => {
    try {
      statusEl.textContent = 'Scanning for nearby SEATFORCE...';
      const device = await navigator.bluetooth.requestDevice({
        filters: [{ name: 'SEATFORCE' }],
        optionalServices: [NUS_SERVICE]
      });

      device.addEventListener('gattserverdisconnected', () => {
        isConnected = false;
        statusEl.textContent = 'Disconnected';
        sendBtn.disabled = true;
        connectBtn.disabled = false;
        releaseWakeLock();
        resetToReady();
      });

      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(NUS_SERVICE);
      rxChar = await service.getCharacteristic(NUS_RX);
      const txChar = await service.getCharacteristic(NUS_TX);

      await txChar.startNotifications();
      txChar.addEventListener('characteristicvaluechanged', handleNotification);

      await writeLine(getFormattedTime());

      isConnected = true;
      await requestWakeLock();

      statusEl.textContent = 'Connected & Clock Synced';
      sendBtn.disabled = false;
      connectBtn.disabled = true;
      resetToReady();
    } catch (err) {
      statusEl.textContent = 'Connection cancelled or failed';
    }
  });

  sendBtn.addEventListener('click', async () => {
    const name = cartridgeInput.value.trim().toUpperCase();
    if (!name) return;
    currentSession = name;
    await writeLine(getFormattedTime());
    await writeLine(`NAME,${name}`);
    historyBody.innerHTML = '';
    sessionRows = [];
    csvBtn.disabled = true;
    statsLine.textContent = 'Count: 0 • SD: 0.00';
    statusEl.textContent = `Active Case: ${name}`;
    resetToReady();
  });

  csvBtn.addEventListener('click', () => {
    if (sessionRows.length === 0) return;
    const header = 'Session,Time,Force,SD,Count\n';
    const body = sessionRows.map(r => `${r.session},${r.time},${r.force},${r.sd},${r.count}`).join('\n');
    const blob = new Blob([header + body], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${currentSession}_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  });

  function handleNotification(event) {
    const msg = decoder.decode(event.target.value).trim();
    const parts = msg.split(',');

    if (parts.at(0) === 'SEAT') {
      const time = parts.at(1);
      const force = parts.at(2);
      const sd = parts.at(3);
      const count = parts.at(4);

      readingType.textContent = 'Peak Seating Force';
      bigDisplay.style.color = '#4ade80';
      bigDisplay.textContent = force;
      statsLine.textContent = `Count: ${count} • SD: ${sd}`;

      clearTimeout(holdTimeout);
      holdTimeout = setTimeout(resetToReady, 6000);

      sessionRows.push({ session: currentSession, time, force, sd, count });
      csvBtn.disabled = false;

      const row = document.createElement('tr');
      row.innerHTML = `<td>${count}</td><td>${force}</td><td>${sd}</td><td>${time}</td>`;
      historyBody.prepend(row);
    }
  }
</script>
</body>
</html>
